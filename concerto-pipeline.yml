version: 1

environment:
  AUTHOR_NAME: "Mr Fluffy"
  FAVORITE_BOOK: "Bible"

targets:
  build:
    # Each target gets its own fresh checkout, so the configure step lives in
    # this target's setup phase. Files it writes (the build/ folder) carry over
    # to execute, and a failed configure skips the build.
    setup:
      - cmake -S . -B build
    execute:
      - cmake --build build --target all
      - echo "Run the application"
      - echo 5 | ./bin/exe/Release/hello
      - echo "Author Name is $AUTHOR_NAME"
      - echo "Favorite Book is $FAVORITE_BOOK"
    teardown:
      - rm -rf build
    runner_tags:
      - dev
      - x86
      - local

  test:
    depends_on:
      - build
    setup:
      - cmake -S . -B build
    execute:
      - ctest --test-dir build
    teardown:
      - rm -rf build
    runner_tags:
      - dev
      - x86
      - local
